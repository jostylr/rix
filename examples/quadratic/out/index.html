<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>index</title><link rel="stylesheet" href="assets/rix-page.css"></head>
<body><main id="rix-app"><noscript>This RiX page needs JavaScript enabled.</noscript></main><script>globalThis.__RIX_PAGE__={"source":"## Interactive exact quadratic rebasing page.\n##\n## The runner writes this declared page only when given --out=DIR.\n\n.Plugin.Load(\"plot\");\n\n$$a := 1;\n$$b := -3;\n$$c := 2;\n$$center := 1/2;\n$$color := \"#0c7b7f\";\n$$frozen := [];\n\n$$view := {;\n    av := $a;\n    bv := $b;\n    cv := $c;\n    d := $center;\n    currentColor := $color;\n    frozenVersions := $frozen;\n    P := x -> av*x^2 + bv*x + cv;\n    slope := bv + 2*av*d;\n    value := P(d);\n    centerTerm := d \u003c 0 ?? @\"x + @{0 - d}\" ?: @\"x - @{d}\";\n    ## These symmetric bounds cover every value reachable by the sliders:\n    ## |a| \u003c= 5, |b| \u003c= 8, |c| \u003c= 8, and |center| \u003c= 3.\n    ## They keep the origin fixed at the centre of every rendered graph.\n    plotDomain := [-6, 6];\n    plotSeries := [{=\n        coefficients=[slope, value - slope*d],\n        label=\"linear part\",\n        stroke=\"#b45309\",\n        width=2\n    }].Concat(frozenVersions.Map(version -> {=\n        coefficients=version[\"coefficients\"],\n        label=version[\"label\"],\n        stroke=version[\"color\"],\n        width=2\n    }));\n    plot := .plot.Polynomial([av, bv, cv], plotDomain, {=\n        size=[620, 320],\n        yDomain=[-256, 256],\n        label=\"quadratic\",\n        stroke=currentColor,\n        series=plotSeries,\n        ticks=[{= x=d, label=@\"center = @{d}\" }],\n        marks=[{=\n            point=[d, value],\n            label=@\"(@{d}, f(@{d}) = @{value})\",\n            style={= fill=\"#be123c\", stroke=\"#fff\", width=2 },\n            labelStyle={= fill=\"#be123c\", size=13 }\n        }]\n    });\n\n    .Fragment([\n        .Heading(1, \"Quadratic rebasing\"),\n        .Paragraph(@\"Explore f(x) = @{av}x² + @{bv}x + @{cv}, centered at x = @{d}. All values remain exact RiX rationals.\"),\n        .ControlPanel({=\n            title=\"Coefficients and center\",\n            description=\"Each slider recomputes the centered form immediately.\",\n            style={=\n                kinds={= action={= variant=\"primary\" } },\n                ids={= (\"clear-frozen\")={= variant=\"danger\" } }\n            },\n            controls=[\n                .Controls.Slider($$a, -5:5, 1, \"a\"),\n                .Controls.Slider($$b, -8:8, 1, \"b\"),\n                .Controls.Slider($$c, -8:8, 1, \"c\"),\n                .Controls.Slider($$center, -3:3, 1/2, \"center\"),\n                .Controls.Choice($$color, [\n                    {= value=\"#0c7b7f\", label=\"teal\" },\n                    {= value=\"#7c3aed\", label=\"violet\" },\n                    {= value=\"#be123c\", label=\"crimson\" },\n                    {= value=\"#2563eb\", label=\"blue\" }\n                ], \"quadratic color\"),\n                .Controls.Action({=\n                    id=\"freeze\",\n                    target=$$frozen,\n                    action=versions -> versions ++ [{=\n                        coefficients=[av, bv, cv],\n                        color=currentColor,\n                        label=@\"frozen @{versions.Len() + 1}\"\n                    }],\n                    label=\"Freeze quadratic\"\n                }),\n                .Controls.Action({=\n                    id=\"clear-frozen\",\n                    target=$$frozen,\n                    action=versions -> [],\n                    label=\"Clear frozen curves\"\n                })\n            ]\n        }),\n        .Heading(2, \"Centered form\"),\n        .Paragraph(@\"f(x) = @{av}(@{centerTerm})² + @{slope}(@{centerTerm}) + @{value}\"),\n        .Heading(2, \"Quadratic and linear part\"),\n        .Figure(plot, \"The tick marks the selected center; the red point is (center, f(center)).\"),\n        .Heading(2, \"Exact synthetic division\"),\n        .Algebra.SyntheticDivision(d, [av, bv, cv]),\n        .Algebra.SyntheticDivision(d, [av, bv + av*d])\n    ])\n};\n\n## A static 3×3 comparison: each row is a different quadratic and every\n## column uses the same center. This is the same portable output a future PDF\n## exporter will lay out as a comic strip.\ncomicScene := state -> {;\n    av := state[\"a\"];\n    bv := state[\"b\"];\n    cv := state[\"c\"];\n    d := state[\"center\"];\n    P := x -> av*x^2 + bv*x + cv;\n    slope := bv + 2*av*d;\n    value := P(d);\n    .Figure(.plot.Polynomial([av, bv, cv], [-6, 6], {=\n        size=[360, 220],\n        yDomain=[-256, 256],\n        stroke=state[\"color\"],\n        series=[{= coefficients=[slope, value - slope*d], label=\"linear part\", stroke=\"#b45309\", width=2 }],\n        ticks=[{= x=d, label=@\"center = @{d}\" }],\n        marks=[{= point=[d, value], label=@\"(@{d}, @{value})\", style={= fill=\"#be123c\" } }]\n    }), @\"f(x) = @{av}x² + @{bv}x + @{cv}; center @{d}\")\n};\n\ncomic := .Snapshots({=\n    title=\"Quadratic rebasing comic strip\",\n    caption=\"Rows are quadratics; columns share centers −2, 0, and 2.\",\n    columns=3,\n    entries=[\n        {: comicScene, [\n            {= a=1, b=-3, c=2, center=-2, color=\"#0c7b7f\" },\n            {= a=1, b=-3, c=2, center=0, color=\"#0c7b7f\" },\n            {= a=1, b=-3, c=2, center=2, color=\"#0c7b7f\" }\n        ]},\n        {: comicScene, [\n            {= a=2, b=1, c=-3, center=-2, color=\"#7c3aed\" },\n            {= a=2, b=1, c=-3, center=0, color=\"#7c3aed\" },\n            {= a=2, b=1, c=-3, center=2, color=\"#7c3aed\" }\n        ]},\n        {: comicScene, [\n            {= a=-1, b=4, c=1, center=-2, color=\"#be123c\" },\n            {= a=-1, b=4, c=1, center=0, color=\"#be123c\" },\n            {= a=-1, b=4, c=1, center=2, color=\"#be123c\" }\n        ]}\n    ]\n});\n\n.Out(\"comic.html\", comic);\n.Out(\"index.html\", $view)\n","sourcePath":"/Users/jostylr/ai-repos/ratmath/rix/examples/quadratic/quadratic-page.rix","title":"index","plugins":[]};</script><script src="assets/rix-page.js"></script></body></html>
