<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>index</title><link rel="stylesheet" href="assets/rix-page.css"></head>
<body><main id="rix-app"><noscript>This RiX page needs JavaScript enabled.</noscript></main><script>globalThis.__RIX_PAGE__={"source":"## Interactive exact quadratic rebasing page.\n##\n## The runner writes this declared page only when given --out=DIR.\n\n.Plugin.Load(\"plot\");\n\n$$a := 1;\n$$b := -3;\n$$c := 2;\n$$center := 1/2;\n\n$$view := {;\n    av := $a;\n    bv := $b;\n    cv := $c;\n    d := $center;\n    P := x -> av*x^2 + bv*x + cv;\n    slope := bv + 2*av*d;\n    value := P(d);\n    centerTerm := d \u003c 0 ?? @\"x + @{0 - d}\" ?: @\"x - @{d}\";\n    plotDomain := [d - 4, d + 4];\n    plot := .plot.Polynomial([av, bv, cv], plotDomain, {=\n        size=[620, 320],\n        label=\"quadratic\",\n        stroke=\"#0c7b7f\",\n        series=[{=\n            coefficients=[slope, value - slope*d],\n            label=\"linear part\",\n            stroke=\"#b45309\",\n            width=2\n        }],\n        ticks=[{= x=d, label=@\"center = @{d}\" }],\n        marks=[{=\n            point=[d, value],\n            label=@\"(@{d}, f(@{d}) = @{value})\",\n            style={= fill=\"#be123c\", stroke=\"#fff\", width=2 },\n            labelStyle={= fill=\"#be123c\", size=13 }\n        }]\n    });\n\n    .Fragment([\n        .Heading(1, \"Quadratic rebasing\"),\n        .Paragraph(@\"Explore f(x) = @{av}x² + @{bv}x + @{cv}, centered at x = @{d}. All values remain exact RiX rationals.\"),\n        .ControlPanel({=\n            title=\"Coefficients and center\",\n            description=\"Each slider recomputes the centered form immediately.\",\n            controls=[\n                .Controls.Slider($$a, -5:5, 1, \"a\"),\n                .Controls.Slider($$b, -8:8, 1, \"b\"),\n                .Controls.Slider($$c, -8:8, 1, \"c\"),\n                .Controls.Slider($$center, -3:3, 1/2, \"center\")\n            ]\n        }),\n        .Heading(2, \"Centered form\"),\n        .Paragraph(@\"f(x) = @{av}(@{centerTerm})² + @{slope}(@{centerTerm}) + @{value}\"),\n        .Heading(2, \"Quadratic and linear part\"),\n        .Figure(plot, \"The tick marks the selected center; the red point is (center, f(center)).\"),\n        .Heading(2, \"Exact synthetic division\"),\n        .Algebra.SyntheticDivision(d, [av, bv, cv]),\n        .Algebra.SyntheticDivision(d, [av, bv + av*d])\n    ])\n};\n\n.Out(\"index.html\", $view)\n","sourcePath":"/Users/jostylr/ai-repos/ratmath/rix/examples/quadratic/quadratic-page.rix","title":"index","plugins":[]};</script><script src="assets/rix-page.js"></script></body></html>
