name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out RiX
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install

      - name: Run focused JavaScript CI tests
        run: bun run test:ci

      - name: Run native RiX tests
        run: bun run test:rix

      - name: Check editor policy
        run: bun run check:editor-policy

      - name: Check package contents
        run: bun run test:pack
