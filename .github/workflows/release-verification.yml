name: Release verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out RiX
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install

      - name: Run comprehensive release verification
        run: bun run check:release

      - name: Retain verification receipt for this CI environment
        uses: actions/upload-artifact@v4
        with:
          name: release-verification-receipt
          path: tmp/release-verification.json
          if-no-files-found: error
