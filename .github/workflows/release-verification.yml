name: Release verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-verification-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out RiX
        uses: actions/checkout@v6

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2.2.0
        with:
          bun-version: 1.3.10

      - name: Install dependencies
        run: bun install

      - name: Run comprehensive release verification
        run: bun run check:release
