project:
  type: website
  output-dir: _site
  resources:
    - CNAME
    - .nojekyll
    - rix-logo.png
    - parser/demo.html
    - parser/demo.css
    - parser/demo.js
    - parser/rix-logo.png
    - design/parser/spec.pdf
    - design/parser/*.txt
    - scripts/dynamic-navigation.js
    - _navigation.json
  render:
    - index.qmd
    - getting-started.qmd
    - language-at-a-glance.qmd
    - highlights.md
    - introduction.md
    - status.qmd
    - eval/sheet-guide.md
    - eval/output-guide.md
    - eval/controls-guide.md
    - eval/syntax-guide.md
    - eval/methods-guide.md
    - eval/types-and-traits-guide.md
    - reference/system-reference.md
    - plugin-catalog.md
    - developer-guide.qmd
    - eval/README.md
    - parser/architecture.md
    - parser/parsing.md
    - parser/custom-operators.md
    - parser/AST-brief.md
    - parser/array-generators-implementation.md
    - parser/embedded-parsing.md
    - parser/matrix-tensor-implementation.md
    - design/eval/ir-format.md
    - design/eval/cells-assignments.md
    - design/eval/units-and-exact-generators.md
    - design/eval/cayley-polar.md
    - design/eval/symbolic-calculus.md
    - design/eval/structural-arithmetic-todo.md
    - design/eval/transformation-reference.md
    - design/eval/output-model.md
    - design/eval/document-output-todo.md
    - design/eval/control-panel-todo.md
    - design/interactive-output-plugins.md
    - design/eval/rixcel-architecture.md
    - design/eval/rixcel-format.md
    - design/eval/rixcel-todo.md
    - design/plugins.md
    - rix-rationales.md
    - design/parser/spec.md
    - design/parser/questions.md
    - report-2026-04-02.md

profile:
  group:
    - [dynamic, static]

filters:
  - scripts/rix-examples.lua

website:
  title: "RiX"
  site-url: https://jostylr.github.io/rix/
  repo-url: https://github.com/jostylr/rix
  repo-subdir: documentation
  repo-actions: [edit, issue]
  favicon: rix-logo.png
  search:
    location: navbar
    type: overlay
  navbar:
    logo: rix-logo.png
    left:
      - text: Start
        href: getting-started.qmd
      - text: Learn
        href: language-at-a-glance.qmd
      - text: Reference
        href: eval/syntax-guide.md
      - text: Internals
        href: developer-guide.qmd
    right:
      - icon: github
        href: https://github.com/jostylr/rix
        aria-label: RiX on GitHub
  sidebar:
    style: docked
    collapse-level: 1
  back-to-top-navigation: true
  page-footer:
    left: "RiX — Rational Interval Expression Language"
    right: "Documentation built with [Quarto](https://quarto.org/)"

format:
  html:
    theme:
      light: [cosmo, styles.scss]
      dark: [darkly, styles.scss]
    toc: true
    toc-depth: 3
    code-copy: true
    code-overflow: wrap
    anchor-sections: true
    smooth-scroll: true
    link-external-newwindow: true

execute:
  freeze: auto
